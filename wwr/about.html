<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting Travel company | Contact Us</title>
    <meta name="description"
      content="Get in touch Rafting Travel company. Find our address, phone number, email, location map, and submit questions or feedback directly to our team.">
    <meta name="author" content="Ingive Ontita">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/site-logo.png" alt="Rafting Travel company Logo" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <!-- Company Information & Google Map -->
        <section class="contact-info">
            <h2>Our Location & Contact Info</h2>
            <address>
                <p><strong>Address:</strong> 123 River Run Way, ngong, ID 83467</p>
                <p><strong>Phone:</strong> (254) 101 101</p>
                <p><strong>Email:</strong> info@rafting1travelcompany.co.ke</p>
            </address>

            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2868.221!2d-113.895!3d45.175!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDEwJzMwLjAiTiAxMTPCsDUzJzQyLjAiVw!5e0!3m2!1sen!2sus!4v1600000000000"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Rafting Travel company Location Map">
                </iframe>
            </div>
        </section>

        <!-- Employee Profiles -->
        <section class="team">
            <h2>Meet Our Team</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/employee1.png" alt="liz lizabeth - General Manager">
                    <figcaption>liz lizabeth - General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.png" alt="Hosea kibor - Lead River Guide">
                    <figcaption>Hosea kibor - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.png" alt="Agnes Ndanu - Safety Coordinator">
                    <figcaption>Agnes Ndanu - Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">

                <div class="form-item">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Full Name"
                      required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail"
                      placeholder="email@example.com" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here..." required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rafting Travel company | Ingive Ontita</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
